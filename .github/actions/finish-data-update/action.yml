name: Finish data update
description: >
  Validates the data, discards it when invalid, commits and pushes valid changes to the default branch
  (with retry), and opens/updates/closes "Data update failing: <source>" issues. Never fails the job.
inputs:
  sources:
    description: Space-separated status source ids this workflow updates (a failure is recorded for them when validation fails).
    required: true
  paths:
    description: Space-separated paths this workflow may change and commit.
    default: data
  message:
    description: Commit message.
    required: true
outputs:
  deploy:
    description: "'true' when site data (not just the status files) changed and was pushed."
    value: ${{ steps.commit.outputs.deploy }}
runs:
  using: composite
  steps:
    - name: Validate data
      id: validate
      continue-on-error: true
      shell: bash
      run: node web/scripts/validate-data.mjs

    - name: Discard invalid data
      if: steps.validate.outcome == 'failure'
      continue-on-error: true
      shell: bash
      run: |
        echo "::warning::Data validation failed: discarding this update and keeping the previous data."
        git checkout -- ${{ inputs.paths }}
        git clean -fdq ${{ inputs.paths }}
        for s in ${{ inputs.sources }}; do
          python pipeline/common/status.py fail "$s" "update discarded: data validation failed"
        done

    - name: Commit and push
      id: commit
      continue-on-error: true
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        echo "deploy=false" >> "$GITHUB_OUTPUT"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A ${{ inputs.paths }}
        if git diff --cached --quiet; then
          echo "Nothing changed."
          exit 0
        fi
        deploy=false
        if git diff --cached --name-only | grep -qv '^data/_status/'; then deploy=true; fi
        git commit -q -m "$MESSAGE"
        pushed=false
        for attempt in 1 2 3; do
          if git push origin "HEAD:${DEFAULT_BRANCH}"; then pushed=true; break; fi
          echo "Push rejected (attempt $attempt), rebasing on the latest ${DEFAULT_BRANCH}."
          sleep $((attempt * 5))
          if ! git pull --rebase -X theirs origin "${DEFAULT_BRANCH}"; then
            git rebase --abort || true
          fi
        done
        if [ "$pushed" = true ]; then
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not push the data update after 3 attempts; it will be redone at the next run."
        fi

    - name: Alert on repeated failures
      if: always()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          // One issue per source that failed 3 runs in a row; closed again when the source recovers.
          const fs = require('fs');
          try {
            const doc = JSON.parse(fs.readFileSync('data/_status/updates.json', 'utf8'));
            const label = 'data-update';
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Automatic data update problems' });
            } catch (e) { /* exists already, or labels not allowed */ }
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: label, per_page: 100 });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const [source, s] of Object.entries(doc.sources || {})) {
              const title = `Data update failing: ${source}`;
              const existing = open.find((i) => i.title === title && !i.pull_request);
              const n = Number(s.consecutive_failures || 0);
              if (n >= 3) {
                const body = [
                  `The data source \`${source}\` has failed **${n} runs in a row**. The site keeps serving the last good data.`,
                  '',
                  `- Last error: ${s.last_error || 'unknown'}`,
                  `- Last attempt: ${s.last_attempt}`,
                  `- Last success: ${s.last_success || 'never'}`,
                  `- Data covered up to: ${s.data_to || 'unknown'}`,
                  `- Latest run: ${runUrl}`,
                  '',
                  'This issue is updated on every run and closes automatically when the source succeeds again. See `data/_status/updates.json` and `data/_status/log.jsonl`.',
                ].join('\n');
                if (existing) {
                  if (existing.body !== body) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
                } else {
                  await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
                }
              } else if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `\`${source}\` updated successfully again (${s.last_success}). Closing.` });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
            }
          } catch (e) {
            core.warning(`Alert step skipped: ${e.message}`);
          }
