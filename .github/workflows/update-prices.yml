# Weekly price update (Wednesday evening, with a second try on Thursday morning): World Bank Pink Sheet + EIA
# daily spot prices -> data/prices.
# Why Wednesday: EIA publishes its spot-price files once a week, on Wednesday, with data to the Tuesday before.
# Pages read on 23 Nov 2026: https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=RBRTE&f=D and
# https://www.eia.gov/dnav/ng/hist/rngwhhdD.htm ("Release Date: 11/18/2026, Next Release Date: 11/25/2026", both
# Wednesdays), and the "Contents" sheet of the eight .xls files (same dates, latest data 11/17/2026). A Tuesday run
# fetched the previous week's file and left the prices up to 14 days old. 21:43 UTC is after the release (the file
# of 18 Nov is stamped 11:17 AM, no time zone given); the Thursday run catches a late release (EIA moves its
# petroleum releases after federal holidays: see the notice on https://www.eia.gov/petroleum/prices/) and, in the
# first days of a month, the Pink Sheet (second business day).
# An unchanged file is not a failure and commits no price data.
# Never fails because a source is down: each step is continue-on-error, invalid data is discarded, a step that did not
# finish is recorded as failed, and the owner is only alerted (one GitHub issue per source) after 3 failed runs in a row.
name: Update prices

on:
  schedule:
    - cron: "43 21 * * 3"
    - cron: "43 9 * * 4"
  workflow_dispatch:
    inputs:
      accept-large-moves:
        description: "Accept prices that the before-and-after guard refused (a last value that moved by more than half), after checking them by hand"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# One concurrency group for the three update workflows: one writer at a time on main (a run waits for the one in
# progress; GitHub keeps one waiting run per group, a newer one replaces it and the replaced run shows as cancelled).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      deploy: ${{ steps.finish.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Note the start time
        id: start
        run: echo "t=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Python dependencies
        continue-on-error: true
        timeout-minutes: 10
        # the exact versions of requirements-lock.txt (pipeline/requirements.txt names the direct dependencies)
        run: pip install -r pipeline/requirements-lock.txt || (sleep 30 && pip install -r pipeline/requirements-lock.txt)
      - name: Fetch prices and rebuild data/prices
        id: update
        continue-on-error: true
        # a hung source must not hit the job timeout (that would fail the run and e-mail the owner):
        # the step is stopped, recorded as failed by the next step, and the job still finishes green
        timeout-minutes: 25
        run: python pipeline/prices/fetch_prices.py
      - name: Update the "what changed" digest and feed
        id: changes
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/common/changes.py
      - name: Validate, commit, alert
        id: finish
        uses: ./.github/actions/finish-data-update
        env:
          DATA_GUARD: ${{ inputs.accept-large-moves && 'off' || 'on' }}
        with:
          sources: "wb-pink eia-spot bls dallasfed nyfed build-changes"
          # pipeline/cache/bls: the history of the BLS series, completed a few years at each run (keyless quota)
          paths: "data/prices data/_status pipeline/cache/bls web/public/changes.atom"
          message: "data: update prices"
          steps: |
            ${{ steps.update.outcome }} wb-pink eia-spot bls dallasfed nyfed
            ${{ steps.changes.outcome }} build-changes
          since: ${{ steps.start.outputs.t }}

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
      soft: true   # a failed check skips the publication without failing this run (no e-mail)
