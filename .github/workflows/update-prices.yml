# Weekly price update (Tuesday): World Bank Pink Sheet + EIA daily spot prices -> data/prices.
# Never fails because a source is down: each step is continue-on-error, invalid data is discarded,
# and the owner is only alerted (one GitHub issue per source) after 3 failed runs in a row.
name: Update prices

on:
  schedule:
    - cron: "43 17 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      deploy: ${{ steps.finish.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python dependencies
        continue-on-error: true
        timeout-minutes: 10
        run: pip install -r pipeline/requirements.txt || (sleep 30 && pip install -r pipeline/requirements.txt)
      - name: Fetch prices and rebuild data/prices
        continue-on-error: true
        # a hung source must not hit the job timeout (that would fail the run and e-mail the owner):
        # the step is stopped, recorded as failed, and the job still finishes green
        timeout-minutes: 25
        run: python pipeline/prices/fetch_prices.py
      - name: Validate, commit, alert
        id: finish
        uses: ./.github/actions/finish-data-update
        with:
          sources: "wb-pink eia-spot"
          paths: "data"
          message: "data: update prices"

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
