# Monthly release watcher (3rd of the month) of the pages the atlas reads by hand once a year
# (pipeline/common/release_watch.json: EIA World Oil Transit Chokepoints, the GIIGNL annual report, the WNA uranium
# table). One request per page with the downloader's plain identification; a page whose date or Last-Modified header
# differs from the one recorded opens one issue "New release available: <id>" with the tasks, closed once the value is
# recorded. When the watcher itself cannot run (Python, its dependency or its script failing), one issue "Watcher
# failing: Watch yearly releases" says so, closed at the next run that succeeds. Writes nothing to the repository and
# never fails (no failure e-mail).
name: Watch yearly releases

on:
  schedule:
    - cron: "41 14 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-releases
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: pipeline/common
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: setup
        # not fatal: a failure here is reported by the "Watcher failing" issue, not by a red run
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Install the downloader's dependency
        id: install
        continue-on-error: true
        # into the Python of setup-python: the runner's own Python may refuse pip installs (PEP 668, externally managed)
        run: python -m pip install $(grep -E '^(requests|certifi|charset-normalizer|idna|urllib3)==' pipeline/requirements-lock.txt)
      - name: Compare each page with the release recorded
        id: watch
        continue-on-error: true
        timeout-minutes: 5
        # "shell: bash" runs with pipefail: a failed script is a failed step, even through tee
        shell: bash
        run: python pipeline/common/watch_releases.py | tee "$RUNNER_TEMP/releases.json"
      - name: Open or close the "New release available" issues
        if: steps.watch.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            try {
              const res = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/releases.json`, 'utf8'));
              const label = 'data-update';
              try {
                await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Automatic data update problems' });
              } catch (e) { /* exists already, or labels not allowed */ }
              const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: label, per_page: 100 });
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              for (const [id, c] of Object.entries(res.changed || {})) {
                const title = `New release available: ${id}`;
                const body = [
                  `The page of **${c.name}** has changed: recorded \`${c.known}\`, now \`${c.now}\`.`,
                  '',
                  c.url,
                  ...(c.note ? ['', c.note] : []),
                  '',
                  ...c.todo.map((t) => `- [ ] ${t}`),
                  '',
                  `- Latest check: ${runUrl}`,
                  '',
                  'This issue closes automatically once `known` in pipeline/common/release_watch.json is the new value.',
                ].join('\n');
                const existing = open.find((i) => i.title === title && !i.pull_request);
                if (!existing) await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
                else if (existing.body !== body) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              }
              for (const id of res.same || []) {
                const existing = open.find((i) => i.title === `New release available: ${id}` && !i.pull_request);
                if (!existing) continue;
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: 'The release in use is recorded. Closing.' });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
              for (const [id, msg] of Object.entries(res.errors || {})) core.warning(`${id}: ${msg}`);
            } catch (e) {
              core.warning(`Release issues skipped: ${e.message}`);
            }
      - name: Open or close the "Watcher failing" issue
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          OUTCOMES: |
            ${{ steps.setup.outcome }} Set up Python
            ${{ steps.install.outcome }} Install the downloader's dependency
            ${{ steps.watch.outcome }} Compare each page with the release recorded
          WORKFLOW_FILE: .github/workflows/watch-releases.yml
        with:
          script: |
            // the watcher's own script did not succeed: one issue, closed at the next run that succeeds
            const failed = process.env.OUTCOMES.split('\n').map((l) => l.trim().split(' ')).filter(([o]) => o && o !== 'success')
              .map(([o, ...name]) => `${name.join(' ')} (${o})`);
            const title = `Watcher failing: ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const label = 'data-update';
              const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: label, per_page: 100 });
              const existing = open.find((i) => i.title === title && !i.pull_request);
              if (failed.length) {
                core.warning(`The watcher did not run: ${failed.join(', ')}`);
                try {
                  await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Automatic data update problems' });
                } catch (e) { /* exists already, or labels not allowed */ }
                const body = [
                  `The scheduled watcher **${context.workflow}** (\`${process.env.WORKFLOW_FILE}\`) did not do its check, so it can report nothing.`,
                  '',
                  `- Failed: ${failed.join(', ')}`,
                  `- Run: ${runUrl}`,
                  '',
                  'Read the log of the failed step. This issue is updated at each run and closes automatically when the watcher runs again. See docs/UPDATING.md.',
                ].join('\n');
                if (!existing) await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
                else if (existing.body !== body) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              } else if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `The watcher ran again: ${runUrl}. Closing.` });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
            } catch (e) {
              core.warning(`Watcher issue skipped: ${e.message}`);
            }
