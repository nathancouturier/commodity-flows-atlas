# Monthly release watcher (3rd of the month) of the pages the atlas reads by hand once a year
# (pipeline/common/release_watch.json: EIA World Oil Transit Chokepoints, the GIIGNL annual report, the WNA uranium
# table). One request per page with the downloader's plain identification; a page whose date or Last-Modified header
# differs from the one recorded opens one issue "New release available: <id>" with the tasks, closed once the value is
# recorded. Writes nothing to the repository and never fails (no failure e-mail).
name: Watch yearly releases

on:
  schedule:
    - cron: "41 14 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-releases
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: pipeline/common
      - name: Install the downloader's dependency
        id: install
        continue-on-error: true
        run: pip install $(grep -E '^(requests|certifi|charset-normalizer|idna|urllib3)==' pipeline/requirements-lock.txt)
      - name: Compare each page with the release recorded
        id: watch
        continue-on-error: true
        timeout-minutes: 5
        run: python3 pipeline/common/watch_releases.py | tee "$RUNNER_TEMP/releases.json"
      - name: Open or close the "New release available" issues
        if: steps.watch.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            try {
              const res = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/releases.json`, 'utf8'));
              const label = 'data-update';
              try {
                await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Automatic data update problems' });
              } catch (e) { /* exists already, or labels not allowed */ }
              const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: label, per_page: 100 });
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              for (const [id, c] of Object.entries(res.changed || {})) {
                const title = `New release available: ${id}`;
                const body = [
                  `The page of **${c.name}** has changed: recorded \`${c.known}\`, now \`${c.now}\`.`,
                  '',
                  c.url,
                  ...(c.note ? ['', c.note] : []),
                  '',
                  ...c.todo.map((t) => `- [ ] ${t}`),
                  '',
                  `- Latest check: ${runUrl}`,
                  '',
                  'This issue closes automatically once `known` in pipeline/common/release_watch.json is the new value.',
                ].join('\n');
                const existing = open.find((i) => i.title === title && !i.pull_request);
                if (!existing) await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
                else if (existing.body !== body) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              }
              for (const id of res.same || []) {
                const existing = open.find((i) => i.title === `New release available: ${id}` && !i.pull_request);
                if (!existing) continue;
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: 'The release in use is recorded. Closing.' });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
              for (const [id, msg] of Object.entries(res.errors || {})) core.warning(`${id}: ${msg}`);
            } catch (e) {
              core.warning(`Release issues skipped: ${e.message}`);
            }
