# Builds the web app and deploys it to GitHub Pages on every push to main.
# If Pages is not enabled yet (Settings > Pages > Source: GitHub Actions), the job
# finishes green with a notice instead of failing, so no failure e-mail is sent.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Validate data files
        run: node web/scripts/validate-data.mjs
      - name: Build
        run: npm run build
        working-directory: web
      - name: Check Pages is enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages not enabled notice
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository. Enable it in Settings > Pages > Source: GitHub Actions, then re-run this workflow."
          echo "### Site built but not deployed: enable GitHub Pages (Settings > Pages > Source: GitHub Actions)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
