# Weekly chokepoint transit update (Wednesday): IMF PortWatch -> data/freight/portwatch (only the days after the last one
# stored are downloaded, the whole table once a month), then the alert banners.
# The daily table (pipeline/cache/portwatch) is a working file that is not in git: the atlas publishes only its own weekly
# averages and comparisons. It is restored at the start of the job from the newest artifact "portwatch-daily" of this
# workflow (kept 90 days) and uploaded again after a successful update; with no usable artifact (first run, expired, corrupt,
# older than a month) the job downloads the whole table (about 80,000 rows, 41 requests, one at a time and at least
# 8 seconds apart: about ten minutes. The owner's rule for PortWatch is: slowly, in small pieces, one request at a
# time; the pause in seconds is the script's reading of it, see fetch_portwatch.py).
# After the chokepoint step, a second PortWatch step keeps the weekly port series (data/freight/port-traffic, one file per
# port) up to date: it asks again for the last weeks of every port and, in rotation, a year of one quarter of the ports, at
# the same pace and one request at a time (pipeline/freight/fetch_portwatch_port_traffic.py; docs/UPDATING.md says what it
# asks for and in how many requests: never more than its MAX_REQUESTS). It writes nothing that the data checks refuse, and
# a failure of that step costs the chokepoint update nothing: both are recorded and committed apart, by the same finish step.
# Never fails because a source is down: each step is continue-on-error, invalid data is discarded, a step that did not
# finish is recorded as failed, and the owner is alerted by one GitHub issue per source (after 3 failed runs in a row,
# at the first failure of the alert banners).
name: Update PortWatch

on:
  schedule:
    - cron: "17 19 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read   # list and download the artifact of the previous run

# One concurrency group for the three update workflows: one writer at a time on main (a run waits for the one in
# progress; GitHub keeps one waiting run per group, a newer one replaces it and the replaced run shows as cancelled).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # the limits of the steps add up to 66 minutes (10 + 5 + 25 + 15 + 1 + 5 + 5); the checkout, the setups, the finish step and
    # the artifact upload have none, so the job gets 15 minutes more: a job limit that is hit is a red run and an e-mail
    # (pipeline/tests/test_update_jobs.py keeps it at the sum plus 15)
    timeout-minutes: 81
    outputs:
      deploy: ${{ steps.finish.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Note the start time
        id: start
        run: echo "t=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Python dependencies
        continue-on-error: true
        timeout-minutes: 10
        # the exact versions of requirements-lock.txt (pipeline/requirements.txt names the direct dependencies)
        run: pip install -r pipeline/requirements-lock.txt || (sleep 30 && pip install -r pipeline/requirements-lock.txt)
      - name: Restore the PortWatch daily table from the last run
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/freight/restore_portwatch.py
      - name: Fetch PortWatch and rebuild chokepoint series
        id: fetch
        continue-on-error: true
        # a hung source must not hit the job timeout (that would fail the run and e-mail the owner):
        # the step is stopped, recorded as failed by the finish step, and the job still finishes green
        timeout-minutes: 25
        run: python pipeline/freight/fetch_portwatch.py
      - name: Fetch PortWatch port traffic and rebuild the port series
        id: ports
        continue-on-error: true
        # the script stops asking after twelve minutes and always exits 0; this limit is for a service that hangs
        timeout-minutes: 15
        run: python pipeline/freight/fetch_portwatch_port_traffic.py
      - name: Remove a port file left half written
        continue-on-error: true
        timeout-minutes: 1
        # a step killed between the writing of a file and its move into place leaves `<id>.json.tmp`, a name that the data checks
        # refuse, and a refusal discards the whole update, the chokepoint series with it
        run: rm -f data/freight/port-traffic/*.tmp
      - name: Rebuild the alert banners from the new series
        id: alerts
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/freight/build_alerts.py
      - name: Update the "what changed" digest and feed
        id: changes
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/common/changes.py
      - name: Validate, commit, alert
        id: finish
        uses: ./.github/actions/finish-data-update
        with:
          sources: "portwatch portwatch-port-traffic build-alerts build-changes"
          paths: "data/freight/portwatch data/freight/port-traffic data/freight/chokepoints.json data/freight/alerts.json data/_status web/public/changes.atom"
          message: "data: update PortWatch chokepoint transits and port traffic"
          steps: |
            ${{ steps.fetch.outcome }} portwatch
            ${{ steps.ports.outcome }} portwatch-port-traffic
            ${{ steps.alerts.outcome }} build-alerts
            ${{ steps.changes.outcome }} build-changes
          since: ${{ steps.start.outputs.t }}
      - name: Keep the PortWatch daily table for the next run
        if: steps.fetch.outputs.cache_updated == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portwatch-daily
          path: pipeline/cache/portwatch
          retention-days: 90
          if-no-files-found: ignore

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write   # the issue "Site not republished: a check failed" (deploy.yml, job report)
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
      soft: true   # a failed check, build or deployment skips the publication without failing this run: one issue says so
