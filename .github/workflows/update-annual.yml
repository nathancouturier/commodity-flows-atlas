# Monthly update (15th, after WASDE): USDA PSD, USGS MCS, EIA INTL, FAOSTAT/WNA (every 80 days), then rebuild dependent data.
# CEPII BACI is only checked: a newer version opens a "New release available: baci" issue, and the refresh is done by
# hand on a local machine (docs/UPDATING.md).
# Never fails because a source is down: each step is continue-on-error, invalid data is discarded, a step that did not
# finish is recorded as failed, and the owner is alerted by one GitHub issue per source (after 2 failed monthly runs,
# at the first failure of a build step). docs/UPDATING.md says what GitHub e-mails and when.
name: Update annual sources

on:
  schedule:
    - cron: "17 22 15 * *"
  workflow_dispatch:
    inputs:
      accept-large-moves:
        description: "Accept a rebuild that the before-and-after guard refused (a table that lost rows, a price that moved by more than half), after checking it by hand"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# One concurrency group for the three update workflows: one writer at a time on main (a run waits for the one in
# progress; GitHub keeps one waiting run per group, a newer one replaces it and the replaced run shows as cancelled).
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      deploy: ${{ steps.finish.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Note the start time
        id: start
        run: echo "t=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Python dependencies
        continue-on-error: true
        timeout-minutes: 10
        # the exact versions of requirements-lock.txt (pipeline/requirements.txt names the direct dependencies)
        run: pip install -r pipeline/requirements-lock.txt || (sleep 30 && pip install -r pipeline/requirements-lock.txt)
      - name: Restore the downloads of the last run
        # raw/ is not in git: without it every source counts as changed and is downloaded again each month, and a
        # source that fails leaves its builder without input. The key changes every run, so the cache is saved each time.
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            raw/usda
            raw/eia
            raw/usgs
          key: raw-annual-${{ github.run_id }}
          restore-keys: raw-annual-
      - name: Update annual sources and rebuild dependent data
        id: update
        continue-on-error: true
        # a hung source must not hit the job timeout (that would fail the run and e-mail the owner):
        # the step is stopped, recorded as failed by the next step, and the job still finishes green
        timeout-minutes: 200
        run: python pipeline/annual/update_annual.py --baci-check-only
      - name: Update the "what changed" digest and feed
        id: changes
        continue-on-error: true
        timeout-minutes: 5
        run: python pipeline/common/changes.py
      - name: Validate, commit, alert
        id: finish
        uses: ./.github/actions/finish-data-update
        env:
          DATA_GUARD: ${{ inputs.accept-large-moves && 'off' || 'on' }}
        with:
          sources: "usda-psd usgs-mcs eia-intl baci faostat-wna build-freight build-alerts build-commodities build-monthly build-profiles build-prices build-changes"
          # only the files the job writes: a hand edit elsewhere in data/ is never part of its commit
          paths: "data/commodities data/countries data/freight data/prices data/sources.json data/_status pipeline/cache pipeline/commodities/QA.md pipeline/freight/QA_routes.md web/public/changes.atom"
          message: "data: monthly update of annual sources"
          steps: |
            ${{ steps.update.outcome }} usda-psd usgs-mcs eia-intl baci ?faostat-wna ?build-prices ?build-freight ?build-alerts ?build-commodities ?build-monthly ?build-profiles
            ${{ steps.changes.outcome }} build-changes
          since: ${{ steps.start.outputs.t }}

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.repository.default_branch }}
      soft: true   # a failed check skips the publication without failing this run (no e-mail)
