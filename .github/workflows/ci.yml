# Checks of the code and the data: type check, the Python unit suite, the node tests, the data validators, a
# production build and its size budget. Runs on every pull request and by hand; on main the deploy workflow calls it
# before it publishes (one run of the checks per push). It does not run on a push to a working branch: such a branch
# receives checkpoints of work in progress, and a failed run would send an e-mail for each of them.
# No linter or formatter rewrites anything: the checks only read.
#
# E-mail: a failed check on a pull request is reported by GitHub to the person who pushed, as for any failed
# workflow. Called by a data update (input soft), every check is allowed to fail: the run stays green, the
# output "ok" is false, the output "failed" names the failed steps, and the deploy workflow does not publish: it
# opens (or updates) one issue "Site not republished: a check failed" with these names, closed when a later run
# publishes (no e-mail beyond GitHub's notice of a new issue).
name: Checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check (default is the triggering commit; a data update passes the branch it pushed to)"
        type: string
        default: ""
      soft:
        description: "Report failed checks in the output instead of failing (scheduled data updates)"
        type: boolean
        default: false
    outputs:
      ok:
        description: "'true' when every check passed"
        value: ${{ jobs.checks.outputs.ok }}
      failed:
        description: "The names of the steps that did not succeed, comma-separated (empty when ok)"
        value: ${{ jobs.checks.outputs.failed }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ok: ${{ steps.verdict.outputs.ok }}
      failed: ${{ steps.verdict.outputs.failed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-lock.txt
      - name: Install
        id: install
        continue-on-error: ${{ inputs.soft == true }}
        run: |
          (cd web && npm ci)
          pip install -r pipeline/requirements-lock.txt
      - name: Type check
        id: typecheck
        continue-on-error: ${{ inputs.soft == true }}
        run: npm run typecheck
        working-directory: web
      - name: Node tests
        id: node
        continue-on-error: ${{ inputs.soft == true }}
        run: npm test
        working-directory: web
      - name: Data validators
        id: validate
        continue-on-error: ${{ inputs.soft == true }}
        run: node web/scripts/validate-data.mjs
      - name: Python unit suite
        id: python
        continue-on-error: ${{ inputs.soft == true }}
        timeout-minutes: 15
        # the tests that read raw downloads (raw/, not in git) skip themselves on a fresh clone
        run: python -m unittest discover -s pipeline/tests -p "test_*.py"
      - name: Production build and size budget
        id: build
        continue-on-error: ${{ inputs.soft == true }}
        run: |
          npm run build
          npm run check-size
        working-directory: web
      - name: Verdict
        id: verdict
        if: always()
        env:
          OUTCOMES: |
            ${{ steps.install.outcome }} Install
            ${{ steps.typecheck.outcome }} Type check
            ${{ steps.node.outcome }} Node tests
            ${{ steps.validate.outcome }} Data validators
            ${{ steps.python.outcome }} Python unit suite
            ${{ steps.build.outcome }} Production build and size budget
        run: |
          ok=true
          failed=""
          while read -r o name; do
            [ -n "$o" ] || continue
            if [ "$o" != success ]; then ok=false; failed="${failed:+$failed, }$name ($o)"; fi
          done <<< "$OUTCOMES"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Checks: ${failed:-all passed}"
          if [ "$ok" != true ]; then echo "::warning::A check failed: $failed"; fi
