<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05080d" />
    <title>Page not found · Commodity Flows Atlas</title>
    <!-- GitHub Pages serves this file for any unknown address under the site, at any depth, so relative links
         cannot work. The site root is worked out in the script at the end: the first path segment on a
         <user>.github.io project site, the host root on a custom domain. -->
    <link id="icon" rel="icon" href="data:," type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #04070c;
        color: #eef3f8;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 24px;
        text-align: center;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 22px;
        font-weight: 650;
      }
      p {
        margin: 0 0 22px;
        color: #b9c4d0;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid #3ee6ff;
        color: #3ee6ff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: rgba(62, 230, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="22" fill="none" stroke="#2a3a4f" stroke-width="3" />
        <path d="M12 39 C 23 15, 42 15, 53 27" fill="none" stroke="#3ee6ff" stroke-width="4" stroke-linecap="round" />
        <circle cx="53" cy="27" r="5" fill="#ffb547" />
      </svg>
      <h1>This page is not on the map</h1>
      <p>The address does not match anything in Commodity Flows Atlas. The atlas is a single page: start from the map and pick a commodity, a country or a route.</p>
      <a id="home" href="/">Open the atlas</a>
    </main>
    <script>
      (function () {
        var seg = location.pathname.split('/')[1];
        var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
        document.getElementById('home').href = base;
        document.getElementById('icon').href = base + 'favicon.svg';
      })();
    </script>
  </body>
</html>
